#cloud-config
hostname: blocked
fqdn: blocked.nip.io

package_update: true
package_upgrade: true

packages:
  - "@development-tools"
  - bind-utils
  - btop
  - bzip2
  - certbot
  - curl
  - file
  - git-lfs
  - golang
  - htop
  - iputils
  - jq
  - neovim
  - net-tools
  - netcat
  - nginx
  - python3
  - python3-devel
  - python3-pip
  - python3-virtualenv
  - ripgrep
  - rsync
  - socat
  - sudo
  - tar
  - tcpdump
  - tmux
  - tree
  - unzip
  - zstd

users:
  - name: cunnie
    gecos: Brian Cunnie
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    groups: wheel
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIWiAzxc4uovfaphO0QVC2w00YmzrogUpjAzvuqaQ9tD

write_files:
  # disable selinux to avoid 403 forbidden on the nginx webserver
  - path: /etc/selinux/config
    permissions: "0644"
    content: |
      SELINUX=disabled
      SELINUXTYPE=targeted

  - path: /etc/nginx/nginx.conf
    permissions: "0644"
    content: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log notice;
      pid /run/nginx.pid;

      include /usr/share/nginx/modules/*.conf;

      events {
          worker_connections 1024;
      }

      http {
          log_format  main  '$host $remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

          access_log  /var/log/nginx/access.log  main;

          sendfile            on;
          tcp_nopush          on;
          keepalive_timeout   65;
          types_hash_max_size 4096;

          include             /etc/nginx/mime.types;
          default_type        application/octet-stream;

          include /etc/nginx/conf.d/*.conf;
      }

  - path: /etc/nginx/conf.d/blocked.conf
    permissions: "0644"
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          listen 443 ssl default_server;
          listen [::]:443 ssl default_server;
          server_name _;
          root /var/www/blocked;
          index index.html;
          ssl_certificate     /etc/letsencrypt/live/blocked.nip.io/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/blocked.nip.io/privkey.pem;
          access_log /var/log/nginx/phishing-access.log main;
          error_log  /var/log/nginx/phishing-error.log;

          location / {
              try_files /index.html =404;
          }
      }

      server {
          listen 80;
          listen [::]:80;
          listen 443 ssl;
          listen [::]:443 ssl;
          server_name 64-176-22-9.nip.io 64.176.22.9.nip.io 40B01609.nip.io;
          root /var/www/sslip.io;
          index index.html;
          ssl_certificate     /etc/letsencrypt/live/blocked.nip.io/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/blocked.nip.io/privkey.pem;

          location / {
              try_files /index.html =404;
          }
      }

  - path: /etc/letsencrypt/renewal-hooks/deploy/nginx-reload.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx

  - path: /etc/systemd/system/sslip.io-dns.service
    permissions: "0644"
    content: |
      [Unit]
      Description=sslip.io DNS server
      Documentation=https://sslip.io/
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/sslip.io-dns-server
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  # /etc/selinux/config (written above) only takes effect on next boot;
  # disable enforcement now too, so certbot's webroot challenge isn't
  # 403'd by SELinux before the end-of-run reboot picks up the config file.
  - setenforce 0
  - mkdir -p /var/www/blocked /var/www/sslip.io /etc/letsencrypt/live/blocked.nip.io
  - curl -L -o /var/www/sslip.io/index.html https://raw.githubusercontent.com/cunnie/sslip.io/refs/heads/main/k8s/document_root_sslip.io/index.html
  - curl -L -o /var/www/sslip.io/experimental.html https://raw.githubusercontent.com/cunnie/sslip.io/refs/heads/main/k8s/document_root_sslip.io/experimental.html
  - curl -L -o /var/www/blocked/index.html https://raw.githubusercontent.com/cunnie/sslip.io/refs/heads/main/k8s/document_root_sslip.io/phishing.html
  - curl -L -o /usr/bin/sslip.io-dns-server https://github.com/cunnie/sslip.io/releases/download/5.1.5/sslip.io-dns-server-linux-amd64
  - chmod +x /usr/bin/sslip.io-dns-server
  # nginx.conf hardcodes the Let's Encrypt cert path, so seed a throwaway
  # cert there just so nginx can pass config-check and start; deleted below
  # once nginx has it open, freeing the path for certbot's webroot challenge.
  - openssl req -x509 -newkey ed25519 -keyout /etc/letsencrypt/live/blocked.nip.io/privkey.pem -out /etc/letsencrypt/live/blocked.nip.io/fullchain.pem -days 1 -nodes -subj "/CN=localhost"
  - systemctl daemon-reload
  - systemctl enable sslip.io-dns.service
  - firewall-cmd --permanent --add-service=dns
  - firewall-cmd --permanent --add-service=http
  - firewall-cmd --permanent --add-service=https
  - firewall-cmd --reload
  - systemctl enable --now nginx
  - rm -rf /etc/letsencrypt/live/blocked.nip.io
  - certbot certonly --webroot -w /var/www/blocked -d blocked.nip.io -w /var/www/sslip.io -d 64.176.22.9.nip.io -d 64-176-22-9.nip.io -d 40B01609.nip.io --non-interactive --agree-tos --email cunnie@majestic-labs.ai
  - systemctl reload nginx
  - systemctl enable --now certbot-renew.timer


power_state:
  mode: reboot
  message: Rebooting to pick up new kernel, if any
  timeout: 60
  condition: true