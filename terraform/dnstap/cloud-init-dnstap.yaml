#cloud-config

hostname: dnstap
fqdn: dnstap.nono.io

package_update: true
package_upgrade: true

packages:
  - "@development-tools"
  - autojump
  - curl
  - dnf-plugins-core
  - golang
  - htop
  - jq
  - neovim
  - netcat
  - python
  - python-devel
  - python3-pip
  - ripgrep
  - tmux
  - wget
  - zsh
  - zsh-autosuggestions

write_files:
  - path: /tmp/cunnie-zshrc
    content: |
      # zsh-autosuggestions setup
      source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
      # autojump setup
      source /usr/share/autojump/autojump.zsh
    permissions: "0644"
  - path: /etc/sysconfig/nftables.conf
    content: |
      table inet filter {
        chain input {
          type filter hook input priority filter; policy drop;
          iifname "lo" accept
          ct state established,related accept
          meta l4proto { icmp, ipv6-icmp } accept
          tcp dport 22 accept
          # CIDR for ns-00 because outbound IPv6 originates from _other_ addr
          ip6 saddr 2400:6180:0:d2::/64     tcp dport 6000 accept # ns-00
          ip6 saddr 2a01:4ff:1f2:10d::      tcp dport 6000 accept # ns-01
          ip6 saddr 2001:41d0:602:2313::1   tcp dport 6000 accept # ns-ovh
          ip6 saddr 2601:645:8105:e060::/64 tcp dport 6000 accept # debugging from home
        }
      }
    permissions: "0644"
  - path: /etc/clickhouse-server/config.d/data-path.xml
    content: |
      <clickhouse>
          <path>/mnt/tap/</path>
          <tmp_path>/mnt/tap/tmp/</tmp_path>
          <user_files_path>/mnt/tap/user_files/</user_files_path>
          <format_schema_path>/mnt/tap/format_schemas/</format_schema_path>
          <access_control_path>/mnt/tap/access/</access_control_path>
      </clickhouse>
    permissions: "0644"
  - path: /etc/dnscollector/config.yml
    content: |
      global:
        server-identity: "dnstap.nono.io"
        telemetry:
          enabled: false

      pipelines:
        - name: tap
          dnstap:
            listen-ip: 0.0.0.0
            listen-port: 6000
          routing-policy:
            forward: [ clickhouse ]
            dropped: [ ]

        - name: clickhouse
          clickhouse:
            url: "http://127.0.0.1:8123"
            user: "default"
            password: ""
            database: "default"
            table: "records"
          # fills as_number & as_owner; DB-IP's ASN Lite is GeoLite2-ASN-compatible (CC BY 4.0)
          transforms:
            geoip:
              mmdb-asn-file: "/usr/share/GeoIP/dbip-asn-lite.mmdb"
    permissions: "0644"
  - path: /etc/systemd/system/dnscollector.service
    content: |
      [Unit]
      Description=DNS-collector (go-dnscollector) dnstap receiver -> ClickHouse
      Documentation=https://github.com/dmachard/DNS-collector
      After=network-online.target clickhouse-server.service
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/dnscollector -config /etc/dnscollector/config.yml
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

users:
  - name: cunnie
    gecos: Brian Cunnie
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    groups: wheel
    shell: /usr/bin/zsh
    passwd: $y$j9T$4zoCOdI.4FH44kvX0/ICE.$.T.49R0ucCTvwMbpRIVQJK0GkSN7rMpQ3psAMQUFqM5
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIWiAzxc4uovfaphO0QVC2w00YmzrogUpjAzvuqaQ9tD cunnie@nono.io

runcmd:
  - curl -fsSL https://raw.githubusercontent.com/wting/autojump/refs/heads/master/bin/autojump.zsh -o /usr/share/autojump/autojump.zsh
  - cp /tmp/cunnie-zshrc /home/cunnie/.zshrc
  - chown cunnie:cunnie /home/cunnie/.zshrc
  - systemctl enable nftables
  # Passed-through 18 TB HDD (Proxmox scsi1); data is disposable, so always
  # wipe (incl. stale ZFS labels), partition (GPT), & format it
  - |
    DISK=/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
    wipefs -a "$DISK"-part* 2>/dev/null || true
    wipefs -a "$DISK"
    printf 'label: gpt\n,,L\n' | sfdisk --wipe always "$DISK"
    udevadm settle
    mkfs.xfs -f -L tap "$DISK"-part1
  - mkdir -p /mnt/tap
  - echo 'LABEL=tap /mnt/tap xfs defaults,noatime,nofail 0 2' >> /etc/fstab
  - systemctl daemon-reload
  - mount /mnt/tap
  - chmod 775 /mnt/tap
  - dnf config-manager addrepo --from-repofile=https://packages.clickhouse.com/rpm/clickhouse.repo
  - dnf install -y clickhouse-server clickhouse-client
  - chown clickhouse:clickhouse /mnt/tap
  # "clickhouse" group doesn't exist until the RPM is installed
  - usermod -aG clickhouse cunnie
  - systemctl enable --now clickhouse-server
  - for i in $(seq 1 30); do clickhouse-client --query "SELECT 1" >/dev/null 2>&1 && break; sleep 1; done
  # Columns match DNS-collector v3's JSONEachRow fields (see docs/loggers/logger_clickhouse.md);
  # queryip is IPv6, which also accepts IPv4 (stored as ::ffff:a.b.c.d). No responseip/responseport:
  # sslip.io doesn't send response_address, and ClickHouse skips the JSON fields that lack a column
  - |
    clickhouse-client --query "
      CREATE TABLE IF NOT EXISTS records (
        timestamp DateTime64(3, 'UTC'),
        timensec UInt64,
        timestamp_rfc3339 String,
        identity LowCardinality(String),
        operation LowCardinality(String),
        family LowCardinality(String),
        protocol LowCardinality(String),
        queryip IPv6,
        queryport UInt16,
        qname String,
        qtype LowCardinality(String),
        rcode LowCardinality(String),
        length UInt16,
        id UInt16,
        opcode UInt8,
        latency Float64,
        qr Bool,
        tc Bool,
        aa Bool,
        ra Bool,
        ad Bool,
        rd Bool,
        cd Bool,
        malformed_packet Bool,
        tld LowCardinality(String),
        etld_plus_one LowCardinality(String),
        city LowCardinality(String),
        country LowCardinality(String),
        as_number UInt32,
        as_owner LowCardinality(String),
        suspicious_score Float64
      ) ENGINE = MergeTree()
      PARTITION BY toYYYYMM(timestamp)
      ORDER BY (timestamp, qname)"
  - curl -L -o /tmp/dnscollector.tar.gz https://github.com/dmachard/DNS-collector/releases/download/v3.2.3/DNS-collector_3.2.3_linux_amd64.tar.gz
  - tar -xzf /tmp/dnscollector.tar.gz -C /usr/bin dnscollector
  - chmod +x /usr/bin/dnscollector
  # DB-IP publishes a new ASN Lite database monthly
  - mkdir -p /usr/share/GeoIP
  - curl -fsSL https://download.db-ip.com/free/dbip-asn-lite-$(date +%Y-%m).mmdb.gz |
      gunzip > /usr/share/GeoIP/dbip-asn-lite.mmdb
  - /usr/bin/dnscollector -test-config -config /etc/dnscollector/config.yml
  - systemctl daemon-reload
  - systemctl enable dnscollector.service

final_message: |
  dnstap.nono.io installation completed!

# Reboot after cloud-init completes to fix
# "Failed to start systemd-binfmt.service - Set Up Additional Binary Formats."
power_state:
  mode: reboot
  message: "Rebooting after cloud-init completion"
  timeout: 60
  condition: true
